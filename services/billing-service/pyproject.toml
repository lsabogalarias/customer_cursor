[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "billing-service"
version = "0.1.0"
description = "Payment history and a mock payment gateway for the portal POC."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "portal-common",
  "pydantic>=2.0",
  "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = ["mypy>=1.13", "pytest>=8.0", "ruff>=0.7"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["billing_service"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
