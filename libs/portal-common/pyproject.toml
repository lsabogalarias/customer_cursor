[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portal-common"
version = "0.1.0"
description = "Shared identity and JWT helpers for the customer portal POC."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.0",
  "pyjwt>=2.9.0",
]

[project.optional-dependencies]
dev = ["mypy>=1.13", "ruff>=0.7"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["portal_common"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
